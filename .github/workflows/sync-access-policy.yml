name: Sync Cloudflare Access Policy

# Runs nightly + can be triggered manually from the Actions tab.
# Pulls the member list from the Access-protected Worker (using the
# opencode-dev service token to bypass Access) and updates the email allow
# policy on the single "TBC Members Area" Access app. The Worker is
# reached at torontobeekeeping.ca/api/members — same origin as the site,
# protected by the same Access app.
# Skips the PUT if the current emails already match.

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = midnight Toronto (EDT)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C
      CF_TOKEN:        ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT:      "7679249973b3ca7cd658c198c69e1e5e"
      # Single merged Access app covering site + API Worker
      APP_ID:          "40f844bc-ff6b-4669-9ec7-22b4a52cf825"
      POLICY_ID:       "d4a7448f-d652-4b66-b8da-a687077ab066"
      WORKER_URL:      "https://torontobeekeeping.ca/api"
      CF_ACCESS_CLIENT_ID:     ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

    steps:
      - name: Sync member emails to Cloudflare Access policy
        run: |
          set -euo pipefail

          echo "Fetching member list from $WORKER_URL/members ..."
          MEMBERS=$(curl -sf \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$WORKER_URL/members")

          # Sorted, lowercased, deduped email list — used for both diffing and
          # generating the include[] payload.
          DESIRED_EMAILS=$(echo "$MEMBERS" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          emails = sorted({r["Email"].strip().lower() for r in data["rows"] if r.get("Email","").strip()})
          print("\n".join(emails))
          ')
          EMAIL_COUNT=$(echo "$DESIRED_EMAILS" | grep -c . || true)
          echo "Found $EMAIL_COUNT members with email addresses."

          if [ "$EMAIL_COUNT" -lt 1 ]; then
            echo "ERROR: refusing to push an empty member list."
            exit 1
          fi
          echo "$DESIRED_EMAILS" > "$RUNNER_TEMP/members.txt"

          DESIRED_INCLUDE=$(echo "$DESIRED_EMAILS" | python3 -c '
          import json, sys
          rules = [{"email": {"email": e}} for e in sys.stdin.read().splitlines() if e]
          print(json.dumps(rules))
          ')

          echo
          echo "── TBC Members Area ──"
          CURRENT=$(curl -sf \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/access/apps/$APP_ID/policies/$POLICY_ID")

          CURRENT_EMAILS=$(echo "$CURRENT" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          emails = sorted({r["email"]["email"].strip().lower() for r in d["result"].get("include", []) if "email" in r})
          print("\n".join(emails))
          ')

          if [ "$CURRENT_EMAILS" = "$DESIRED_EMAILS" ]; then
            n=$(echo "$CURRENT_EMAILS" | grep -c . || true)
            echo "No changes ($n emails)."
            echo "Sync complete."
            exit 0
          fi

          TO_ADD=$(comm -13 <(echo "$CURRENT_EMAILS") <(echo "$DESIRED_EMAILS"))
          TO_REMOVE=$(comm -23 <(echo "$CURRENT_EMAILS") <(echo "$DESIRED_EMAILS"))

          echo "Needs update."
          echo "  add: $(echo "$TO_ADD" | grep -c . || true), remove: $(echo "$TO_REMOVE" | grep -c . || true)"

          PAYLOAD=$(DESIRED_INCLUDE="$DESIRED_INCLUDE" python3 -c '
          import json, os
          print(json.dumps({
            "name":       "TBC Members",
            "decision":   "allow",
            "precedence": 1,
            "include":    json.loads(os.environ["DESIRED_INCLUDE"]),
          }))
          ')

          RESPONSE=$(curl -sf -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/access/apps/$APP_ID/policies/$POLICY_ID" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          SUCCESS=$(echo "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("success", False))')
          if [ "$SUCCESS" != "True" ]; then
            echo "ERROR: update failed:"
            echo "$RESPONSE" | python3 -m json.tool
            exit 1
          fi
          echo "Updated to $EMAIL_COUNT emails."

          echo
          echo "Sync complete."

      # The free Zero Trust plan has 50 seats, and anyone who has ever logged
      # in keeps one until removed. Removing a seat doesn't block login; the
      # policy above does that. Prints counts only because Actions logs on a
      # public repo are public.
      - name: Free seats held by people no longer on the member list
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.request

          members = {l.strip() for l in open(os.path.join(os.environ["RUNNER_TEMP"], "members.txt")) if l.strip()}
          if not members:
              sys.exit("ERROR: empty member list; not touching seats.")

          def call(method, path, body=None):
              req = urllib.request.Request(
                  f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CF_ACCOUNT']}/{path}",
                  method=method,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={"Authorization": f"Bearer {os.environ['CF_TOKEN']}", "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req) as r:
                  d = json.load(r)
              if not d.get("success"):
                  sys.exit(f"ERROR: {method} {path} failed: {d.get('errors')}")
              return d

          users, page = [], 1
          while True:
              d = call("GET", f"access/users?per_page=100&page={page}")
              users += d["result"]
              if page >= d["result_info"]["total_pages"]:
                  break
              page += 1

          seated = [u for u in users if u.get("access_seat") or u.get("gateway_seat")]
          stale = [u for u in seated if u["email"].strip().lower() not in members]
          print(f"{len(seated)} seats in use, {len(stale)} held by people not on the member list.")
          if stale:
              call("PATCH", "access/seats", [{"seat_uid": u["seat_uid"], "access_seat": False, "gateway_seat": False} for u in stale])
              print(f"Freed {len(stale)} seats.")
          EOF
