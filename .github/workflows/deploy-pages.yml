name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'worker/**'
  workflow_dispatch:
  schedule:
    # Daily rebuild at 09:00 UTC (~4-5am Toronto) so build-time data fetched
    # from external sources stays fresh. Currently: the events page pulls
    # pop-up sale locations from a public Google Maps saved list at build
    # time (src/lib/google-list.mjs). If that fetch/parse breaks, this build
    # fails loudly while the live site keeps the last good deploy.
    - cron: '0 9 * * *'

jobs:
  deploy:
    name: Deploy Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build
        # HIVE_WORKER_URL is intentionally unset: the Worker now lives at
        # torontobeekeeping.ca/api/* (same origin), so the Astro pages use
        # relative /api/... paths in production.

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=tbc-website --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7679249973b3ca7cd658c198c69e1e5e
