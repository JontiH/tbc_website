name = "tbc-sheets-worker"
main = "index.js"
compatibility_date = "2024-01-01"

# Worker is deployed separately from the Astro site.
# Run: cd worker && npx wrangler deploy

# Worker is exposed on a custom domain protected by Cloudflare Access.
# The *.workers.dev URL is disabled — the Worker is only reachable via
# api.torontobeekeeping.ca, which is gated by the "TBC Members Area"
# Access app. The Access app also covers the merged site /members paths,
# so a logged-in member's CF_Authorization cookie is preemptively set on
# api.torontobeekeeping.ca and fetch() with credentials:include works
# without a redirect.
workers_dev = false

[[routes]]
pattern       = "api.torontobeekeeping.ca"
custom_domain = true

# Non-secret config — sheet IDs and ranges live here in version control
[vars]
CACHE_VER           = "5"
HIVE_SHEET_ID       = "1p-D7_nLmrNIFZyfRJcRO-d_u3PjaSeySLxd6rh5iMGA"
HIVE_SHEET_RANGE    = "Form responses 1!A:J"
MEMBERS_SHEET_ID    = "1_0gi606_DPJunKEDMx7v6KRwrZA1uVG9f7Cumr2XCqQ"
MEMBERS_SHEET_RANGE = "TBC Memberships!A:C"
HIVE_FORM_ID        = "1r_lj8nvUjM9avrTvlrb9Zd_V0WldP7eUOdUiSH01Jac"

# Secrets are set via wrangler secret put (never committed):
#   npx wrangler secret put GOOGLE_SERVICE_ACCOUNT_EMAIL
#   npx wrangler secret put GOOGLE_PRIVATE_KEY
